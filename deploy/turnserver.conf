# coturn for chatter — rendered by deploy/turn-setup.sh (@SECRET@ / @IP@ substituted).
# Only two users ever call each other, so quotas are tiny on purpose.

listening-port=3478
listening-ip=0.0.0.0
external-ip=@IP@
relay-ip=@IP@
min-port=49160
max-port=49200

# Time-limited credentials: username = "<unix-expiry>:<user>", password = base64(HMAC-SHA1(secret, username))
lt-cred-mech
use-auth-secret
static-auth-secret=@SECRET@
realm=chatter
fingerprint

# Hardening
no-cli
no-multicast-peers
no-tcp-relay
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
stale-nonce=600
total-quota=8
user-quota=4
max-bps=3000000
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

log-file=/var/log/coturn/turnserver.log
simple-log
no-software-attribute
