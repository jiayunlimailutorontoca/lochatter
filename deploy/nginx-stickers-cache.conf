# Cache zone for the sticker library reverse proxy (location /stickers/ in chat.example.com.conf).
# Installed by deploy.sh as /etc/nginx/conf.d/chatter-stickers-cache.conf (http context).
proxy_cache_path /var/cache/nginx/stickers levels=1:2 keys_zone=stickers:10m max_size=2g inactive=30d use_temp_path=off;
# Map tiles (1.6): /tiles/ in chat.example.com.conf. 2 GB is ~30k tiles, far more than two phones ever look at.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=2g inactive=60d use_temp_path=off;
