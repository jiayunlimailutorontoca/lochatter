# chat.example.com -> chatter on 127.0.0.1:5088
# deploy.sh rewrites chat.example.com and __CERT_DIR__ from /etc/chatter/deploy.env
# (CHATTER_DOMAIN, CHATTER_SSL_DIR). Certificate files are not in this repo.

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/nginx/ssl/__CERT_DIR__/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/__CERT_DIR__/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 0;
    access_log /var/log/nginx/chat.access.log;
    error_log  /var/log/nginx/chat.error.log;

    # WebSocket: long-lived, no buffering
    location = /ws {
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # APK downloads (public; the app holds no secrets)
    location /apk/ {
        alias /var/www/chatter/;
        autoindex off;
        types { application/vnd.android.package-archive apk; application/json json; }
        default_type application/octet-stream;
    }

    # Map tiles (1.6): OpenStreetMap through a 30-day cache, no auth. Standard XYZ, z 0..19. proxy_cache_path "tiles" is in conf.d.
    location ~ "^/tiles/(\d{1,2})/(\d+)/(\d+)\.png$" {
        # No variables in proxy_pass (nginx would need a resolver); the URI is rewritten instead.
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass https://tile.openstreetmap.org;
        proxy_ssl_server_name on;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "lochatter/1.6 (private 1:1 chat; +https://chat.example.com)";
        proxy_set_header Accept-Encoding "";
        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        proxy_cache_valid any 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache $upstream_cache_status;
        expires 30d;
    }

    # Amap raster tiles (1.7, GCJ-02; the app converts): same cache. Enabled on the app side by CHATTER_TILES=amap.
    location ~ "^/amap-tiles/(\d{1,2})/(\d+)/(\d+)\.png$" {
        rewrite "^/amap-tiles/(\d+)/(\d+)/(\d+)\.png$" /appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=$2&y=$3&z=$1 break;
        proxy_pass https://webrd01.is.autonavi.com;
        proxy_ssl_server_name on;
        proxy_set_header Host webrd01.is.autonavi.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12) lochatter/1.7";
        proxy_set_header Referer "";
        proxy_set_header Accept-Encoding "";
        proxy_cache tiles;
        proxy_cache_key "amap$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid any 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache $upstream_cache_status;
        expires 30d;
    }

    # Sticker library (ChineseBQB): cached reverse proxy, no auth. proxy_cache_path lives in conf.d/chatter-stickers-cache.conf.
    location /stickers/ {
        proxy_pass https://zhaoolee.com/ChineseBQB/;
        proxy_ssl_server_name on;
        proxy_set_header Host zhaoolee.com;
        proxy_set_header Accept-Encoding "";
        proxy_cache stickers;
        proxy_cache_valid 200 30d;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache $upstream_cache_status;
        expires 30d;
    }

    # 1.9 web prototype. Same host as the API, so the page can call /auth, /ws and /media.
    location = /web { return 302 /web/; }
    location /web/ {
        root /var/www/chatter;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # REST + media upload/download
    location / {
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
